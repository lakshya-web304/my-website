<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lakshya Garg</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:monospace;
scroll-behavior:smooth;
}

body{
background:black;
overflow-x:hidden;
color:#00ff66;
}

/* MATRIX BACKGROUND */

canvas{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-1;
}

/* CENTER */

.center{

height:100vh;

display:flex;
justify-content:center;
align-items:center;
flex-direction:column;

text-align:center;

padding:20px;

}

/* NAME */

h1{

font-size:80px;

color:#00ff66;

text-shadow:
0 0 10px #00ff66,
0 0 30px #00ff66,
0 0 60px #00ff66;

animation:glow 2s infinite alternate;

}

/* GLOW */

@keyframes glow{

from{

text-shadow:
0 0 10px #00ff66,
0 0 30px #00ff66;

}

to{

text-shadow:
0 0 20px #00ff66,
0 0 50px #00ff66,
0 0 80px #00ff66;

}

}

/* ERROR TEXT */

.error-text{

margin-top:120px;

font-size:60px;

color:#00ff66;

text-shadow:
0 0 10px #00ff66,
0 0 30px #00ff66;

opacity:0;

transform:translateY(100px);

transition:1s;

text-align:center;

}

/* SKULL */

.skull{

font-size:180px;

color:#00ff66;

text-shadow:
0 0 20px #00ff66,
0 0 50px #00ff66;

margin-top:80px;

opacity:0;

transform:scale(0.5);

transition:1s;

text-align:center;

}

/* SHOW */

.show{

opacity:1;

transform:
translateY(0)
scale(1);

}

/* FOOTER */

footer{

padding:40px;

text-align:center;

font-size:22px;

color:#00ff66;

text-shadow:
0 0 10px #00ff66,
0 0 30px #00ff66;

margin-top:200px;

}

/* MOBILE */

@media(max-width:768px){

h1{
font-size:45px;
}

.error-text{
font-size:40px;
}

.skull{
font-size:120px;
}

}

</style>

</head>

<body onclick="startMusic()">

<!-- MATRIX BACKGROUND -->

<canvas id="matrix"></canvas>

<!-- MAIN -->

<div class="center">

<h1>LAKSHYA GARG</h1>

</div>

<!-- ERROR -->

<div class="error-text">

ERROR 404

</div>

<!-- SKULL -->

<div class="skull">

☠

</div>

<!-- FOOTER -->

<footer>

© 2026 Lakshya Garg

</footer>

<!-- MUSIC -->

<audio id="music" loop hidden>

<source src="music.mp3" type="audio/mpeg">

</audio>

<script>

/* MATRIX */

const canvas = document.getElementById("matrix");

const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;

canvas.height = window.innerHeight;

const letters =
"アァカサタナハマヤャラワ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";

const fontSize = 16;

const columns = canvas.width / fontSize;

const drops = [];

for(let i = 0; i < columns; i++){

drops[i] = 1;

}

function draw(){

ctx.fillStyle = "rgba(0,0,0,0.08)";

ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle = "#00ff66";

ctx.font = fontSize + "px monospace";

for(let i = 0; i < drops.length; i++){

const text = letters.charAt(
Math.floor(Math.random() * letters.length)
);

ctx.fillText(
text,
i * fontSize,
drops[i] * fontSize
);

if(
drops[i] * fontSize > canvas.height
&& Math.random() > 0.975
){

drops[i] = 0;

}

drops[i]++;

}

}

setInterval(draw,33);

/* MUSIC */

const music = document.getElementById("music");

function startMusic(){

music.play();

}

/* DOUBLE TAP = MUSIC OFF */

let lastTap = 0;

document.addEventListener("touchend",()=>{

let currentTime = new Date().getTime();

let tapLength = currentTime - lastTap;

if(tapLength < 300 && tapLength > 0){

music.pause();

}

lastTap = currentTime;

});

/* SCROLL EFFECT */

const errorText =
document.querySelector(".error-text");

const skull =
document.querySelector(".skull");

window.addEventListener("scroll",()=>{

if(window.scrollY > 50){

errorText.classList.add("show");

skull.classList.add("show");

}

});

/* RESIZE */

window.addEventListener("resize",()=>{

canvas.width = window.innerWidth;

canvas.height = window.innerHeight;

});

</script>

</body>

</html>
